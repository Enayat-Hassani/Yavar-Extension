<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="10" y1="4" x2="118" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A98B4C"/>
      <stop offset="0.5" stop-color="#5E4028"/>
      <stop offset="1" stop-color="#291A11"/>
    </linearGradient>
    <radialGradient id="glow" cx="34" cy="28" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="64" y1="14" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCF5E4"/>
      <stop offset="1" stop-color="#D7BE8E"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#160d06" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#glow)"/>

  <!-- Futuristic orbital accent -->
  <ellipse cx="64" cy="66" rx="46" ry="46" fill="none" stroke="#F3E7CB" stroke-opacity="0.30"
           stroke-width="2.5" stroke-dasharray="20 12" transform="rotate(-24 64 66)"/>

  <!-- Bigger geometric "Yavar" figure / Y -->
  <g filter="url(#soft)">
    <circle cx="64" cy="26" r="12" fill="url(#mark)"/>
    <g fill="none" stroke="url(#mark)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M33 52 L64 74 L95 52"/>
      <path d="M64 74 L64 106"/>
    </g>
    <!-- node accents at the "hands" -->
    <circle cx="33" cy="52" r="4.5" fill="#EFE3C6"/>
    <circle cx="95" cy="52" r="4.5" fill="#EFE3C6"/>
  </g>

  <!-- metallic sheen -->
  <path d="M0 0 H128 L44 128 H0 Z" fill="#ffffff" fill-opacity="0.05" clip-path="url(#tile)"/>
</svg>
