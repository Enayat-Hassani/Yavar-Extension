<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yavar icons</title>
  <style>
    body { margin: 0; padding: 32px; font: 14px/1.5 -apple-system, system-ui, sans-serif; color: #1d1d1f; background: #f8f8fa; }
    .row { display: flex; gap: 24px; align-items: end; margin: 16px 0 24px; }
    figure { margin: 0; text-align: center; font-size: 12px; color: #6e6e73; }
    canvas { display: block; margin-bottom: 6px; }
    button { padding: 8px 14px; font: inherit; color: #fff; background: #0071e3; border: none; border-radius: 999px; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Renders icons/logo.svg (48, 128) and icons/logo-small.svg (16, 32) to
       the PNGs the manifest uses. Serve the extension folder over http (for
       example "python3 -m http.server" in it), open this page, and click
       Download; then move the files into icons/. -->
  <h1>Yavar icons</h1>
  <div class="row" id="row"></div>
  <button type="button" id="download">Download PNGs</button>
  <script type="module">
    const SIZES = [[16, 'logo-small.svg'], [32, 'logo-small.svg'], [48, 'logo.svg'], [128, 'logo.svg']];
    const load = (src) => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
    const canvases = [];
    for (const [size, src] of SIZES) {
      const img = await load(src);
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      canvas.getContext('2d').drawImage(img, 0, 0, size, size);
      const fig = document.createElement('figure');
      fig.append(canvas, `${size} px`);
      document.getElementById('row').append(fig);
      canvases.push([size, canvas]);
    }
    window.iconData = () => Object.fromEntries(canvases.map(([size, c]) => [size, c.toDataURL('image/png').split(',')[1]]));
    document.getElementById('download').addEventListener('click', () => {
      for (const [size, c] of canvases) {
        const a = document.createElement('a');
        a.download = `icon${size}.png`;
        a.href = c.toDataURL('image/png');
        a.click();
      }
    });
  </script>
</body>
</html>
